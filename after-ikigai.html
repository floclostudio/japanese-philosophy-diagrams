<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>After Ikigai — floclo studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
body { margin:0;padding:0;background:#f7f5f0;display:flex;justify-content:center;align-items:center;min-height:100vh; }
.container { width:680px;padding:2.5rem 2rem 1.5rem; }
.bottom { text-align:center;margin-top:0.8rem;font-family:'EB Garamond',serif;font-size:11px;color:#999;letter-spacing:0.15em;line-height:1.8; }
.bottom a { color:#999;text-decoration:none;border-bottom:1px solid #ddd; }
.bottom a:hover { color:#666;border-bottom-color:#999; }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 640 700" xmlns="http://www.w3.org/2000/svg" font-family="'EB Garamond', serif">
  <text x="320" y="28" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="300" font-size="17" fill="#333">After ikigai</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" font-style="italic" fill="#777">What the West borrowed — and what it left behind</text>

  <text x="48" y="148" text-anchor="middle" font-size="10" fill="#888">PROCESS</text>
  <text x="48" y="228" text-anchor="middle" font-size="10" fill="#888">PERCEPTION</text>
  <text x="48" y="308" text-anchor="middle" font-size="10" fill="#888">RESILIENCE</text>
  <text x="48" y="388" text-anchor="middle" font-size="10" fill="#888">PURPOSE</text>

  <line x1="80" y1="432" x2="560" y2="432" stroke="#b0a89a" stroke-width="0.5" stroke-dasharray="6,4"/>
  <text x="320" y="452" text-anchor="middle" font-size="10" font-style="italic" fill="#888">— the borrowing stops here —</text>

  <text x="48" y="508" text-anchor="middle" font-size="10" fill="#4a7a4a">RELATION</text>
  <text x="48" y="568" text-anchor="middle" font-size="10" fill="#4a7a4a">SYSTEM</text>
  <text x="48" y="628" text-anchor="middle" font-size="10" fill="#4a7a4a">TIME</text>

  <line x1="95" y1="120" x2="95" y2="420" stroke="#a09880" stroke-width="1.5"/>
  <line x1="95" y1="470" x2="95" y2="650" stroke="#4a7a4a" stroke-width="1.5"/>

  <circle cx="95" cy="145" r="4" fill="#a09880"/>
  <text x="115" y="140" font-size="13.5" fill="#333">改善 kaizen</text>
  <text x="115" y="157" font-size="10.5" fill="#666">continuous improvement → personal productivity hack</text>
  <text x="520" y="148" text-anchor="end" font-size="10" fill="#888">1980s</text>

  <circle cx="95" cy="225" r="4" fill="#a09880"/>
  <text x="115" y="220" font-size="13.5" fill="#333">侘び寂び wabi-sabi</text>
  <text x="115" y="237" font-size="10.5" fill="#666">beauty of imperfection → interior décor style</text>
  <text x="520" y="228" text-anchor="end" font-size="10" fill="#888">1990s</text>

  <circle cx="95" cy="305" r="4" fill="#a09880"/>
  <text x="115" y="300" font-size="13.5" fill="#333">金継ぎ kintsugi</text>
  <text x="115" y="317" font-size="10.5" fill="#666">golden repair → personal trauma metaphor</text>
  <text x="520" y="308" text-anchor="end" font-size="10" fill="#888">2010s</text>

  <circle cx="95" cy="385" r="4" fill="#a09880"/>
  <text x="115" y="380" font-size="13.5" fill="#333">生き甲斐 ikigai</text>
  <text x="115" y="397" font-size="10.5" fill="#666">a reason for being → career Venn diagram</text>
  <text x="520" y="388" text-anchor="end" font-size="10" fill="#888">2016</text>

  <path d="M535,135 C548,135 548,400 535,400" fill="none" stroke="#a09880" stroke-width="0.8"/>
  <line x1="535" y1="268" x2="548" y2="268" stroke="#a09880" stroke-width="0.8"/>
  <text x="558" y="258" font-size="9.5" fill="#777">kept the</text>
  <text x="558" y="271" font-size="9.5" font-weight="500" fill="#666">individual</text>
  <text x="558" y="284" font-size="9.5" fill="#777">dropped the</text>
  <text x="558" y="297" font-size="9.5" font-weight="500" fill="#666">system</text>

  <circle cx="95" cy="505" r="4" fill="#4a7a4a"/>
  <text x="115" y="500" font-size="13.5" fill="#2a5a2a">手入れ teire</text>
  <text x="115" y="517" font-size="10.5" fill="#5a8a5a">tend the living system — what are you caring for?</text>

  <circle cx="95" cy="565" r="4" fill="#4a7a4a"/>
  <text x="115" y="560" font-size="13.5" fill="#2a5a2a">活かす ikasu</text>
  <text x="115" y="577" font-size="10.5" fill="#5a8a5a">draw out what is latent — what capacity are you activating?</text>

  <circle cx="95" cy="625" r="4" fill="#4a7a4a"/>
  <text x="115" y="620" font-size="13.5" fill="#2a5a2a">推譲 suijō</text>
  <text x="115" y="637" font-size="10.5" fill="#5a8a5a">forward the surplus — what are you sending into the future?</text>

  <path d="M535,495 C548,495 548,638 535,638" fill="none" stroke="#4a7a4a" stroke-width="0.8"/>
  <line x1="535" y1="567" x2="548" y2="567" stroke="#4a7a4a" stroke-width="0.8"/>
  <text x="558" y="555" font-size="9.5" fill="#5a8a5a">self within</text>
  <text x="558" y="568" font-size="9.5" font-weight="500" fill="#3a6a3a">system</text>
  <text x="558" y="581" font-size="9.5" fill="#5a8a5a">not yet</text>
  <text x="558" y="594" font-size="9.5" font-weight="500" fill="#3a6a3a">translated</text>

  <text x="320" y="680" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="300" font-size="12" font-style="italic" fill="#555">Translation, done carefully, is not extraction. It is ikasu.</text>
</svg>
