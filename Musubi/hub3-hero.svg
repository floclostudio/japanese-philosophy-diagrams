<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" role="img" aria-labelledby="title desc">
  <title id="title">A Name for the Threshold — Hub 3 hero</title>
  <desc id="desc">Hero image for Substack. Left side: title "A Name for the Threshold" and subtitle "Musubi, hodoki, and the word stewardship has been missing", plus issue number. Right side: the moment diagram showing two latent streams converging at vital light, with arrow ascending.</desc>

  <style>
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 18px; fill: #6B6B6B; letter-spacing: 0.18em; }
    .title-main { font-family: Georgia, "Times New Roman", serif; font-size: 64px; fill: #2C2C2C; font-style: italic; }
    .subtitle { font-family: Georgia, "Times New Roman", serif; font-size: 24px; fill: #6B6B6B; font-style: italic; }
    .meta { font-family: Georgia, "Times New Roman", serif; font-size: 16px; fill: #999999; letter-spacing: 0.12em; }
    .stream { stroke: #2C2C2C; stroke-width: 1.6; fill: none; opacity: 0.6; }
    .stream-origin { fill: #2C2C2C; opacity: 0.6; }
    .ascending { stroke: #EF9F27; stroke-width: 2; stroke-linecap: round; fill: none; opacity: 0.75; }
    .arrowhead { fill: #EF9F27; opacity: 0.95; }
    .label { font-family: Georgia, "Times New Roman", serif; font-size: 16px; fill: #6B6B6B; }
  </style>

  <!-- Background -->
  <rect width="1456" height="816" fill="#FAFAF7"/>

  <!-- Left column: text -->
  <text class="brand" x="100" y="120">FLOCLO STUDIO</text>

  <!-- Divider -->
  <line x1="100" y1="160" x2="180" y2="160" stroke="#EF9F27" stroke-width="2" opacity="0.8"/>

  <!-- Main title (two lines for balance) -->
  <text class="title-main" x="100" y="340">A Name for</text>
  <text class="title-main" x="100" y="412">the Threshold</text>

  <!-- Subtitle -->
  <text class="subtitle" x="100" y="490">Musubi, hodoki, and the word</text>
  <text class="subtitle" x="100" y="522">stewardship has been missing</text>

  <!-- Issue meta -->
  <text class="meta" x="100" y="700">HUB 3 · ON STEWARDSHIP VOCABULARY</text>

  <!-- Right column: diagram (scaled and positioned) -->
  <g transform="translate(880, 130) scale(1.15)">
    <!-- Ascending line -->
    <line class="ascending" x1="240" y1="240" x2="240" y2="60"/>
    <path class="arrowhead" d="M 240 48 L 232 66 L 248 66 Z"/>

    <!-- Vital force kindling at convergence -->
    <circle cx="240" cy="252" r="60" fill="#EF9F27" opacity="0.05"/>
    <circle cx="240" cy="252" r="44" fill="#EF9F27" opacity="0.13"/>
    <circle cx="240" cy="252" r="28" fill="#EF9F27" opacity="0.30"/>
    <circle cx="240" cy="252" r="14" fill="#EF9F27" opacity="0.70"/>
    <circle cx="240" cy="252" r="6" fill="#EF9F27" opacity="1"/>

    <!-- Two streams -->
    <path class="stream" d="M 20 460 C 90 388, 160 320, 226 264"/>
    <path class="stream" d="M 460 460 C 390 388, 320 320, 254 264"/>

    <!-- Stream origin markers -->
    <circle class="stream-origin" cx="20" cy="460" r="4"/>
    <circle class="stream-origin" cx="460" cy="460" r="4"/>

    <!-- Latent labels -->
    <text class="label" x="20" y="488" text-anchor="middle">latent</text>
    <text class="label" x="460" y="488" text-anchor="middle">latent</text>
  </g>
</svg>
