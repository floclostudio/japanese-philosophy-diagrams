<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ten Words, One Premise — floclo studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
body { margin:0;padding:0;background:#f7f5f0;display:flex;justify-content:center;align-items:center;min-height:100vh; }
.container { width:720px;padding:2.5rem 2rem 1.5rem; }
.bottom { text-align:center;margin-top:0.8rem;font-family:'EB Garamond',serif;font-size:11px;color:#999;letter-spacing:0.15em;line-height:1.8; }
.bottom a { color:#999;text-decoration:none;border-bottom:1px solid #ddd; }
.bottom a:hover { color:#666;border-bottom-color:#999; }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" font-family="'EB Garamond', serif">
  <text x="340" y="28" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="300" font-size="17" fill="#333">Ten words, one premise</text>
  <line x1="140" y1="52" x2="140" y2="700" stroke="#a09880" stroke-width="1.5"/>

  <text x="126" y="78" text-anchor="end" font-size="12" font-weight="500" fill="#666">1953</text>
  <circle cx="140" cy="74" r="3.5" fill="#a09880"/>
  <text x="160" y="72" font-size="14" fill="#333">Corporate Social Responsibility</text>
  <text x="160" y="88" font-size="10.5" fill="#666">Companies should give back to society</text>

  <text x="126" y="128" text-anchor="end" font-size="12" font-weight="500" fill="#666">1987</text>
  <circle cx="140" cy="124" r="3.5" fill="#a09880"/>
  <text x="160" y="122" font-size="14" fill="#333">Sustainability</text>
  <text x="160" y="138" font-size="10.5" fill="#666">Meet present needs without compromising the future</text>

  <text x="126" y="178" text-anchor="end" font-size="12" font-weight="500" fill="#666">1994</text>
  <circle cx="140" cy="174" r="3.5" fill="#a09880"/>
  <text x="160" y="172" font-size="14" fill="#333">Triple Bottom Line</text>
  <text x="160" y="188" font-size="10.5" fill="#666">Measure people, planet, and profit together</text>

  <text x="126" y="228" text-anchor="end" font-size="12" font-weight="500" fill="#666">2005</text>
  <circle cx="140" cy="224" r="3.5" fill="#a09880"/>
  <text x="160" y="222" font-size="14" fill="#333">ESG</text>
  <text x="160" y="238" font-size="10.5" fill="#666">Translate sustainability into investor decisions</text>

  <text x="126" y="278" text-anchor="end" font-size="12" font-weight="500" fill="#666">2010s</text>
  <circle cx="140" cy="274" r="3.5" fill="#a09880"/>
  <text x="160" y="272" font-size="14" fill="#333">Circular Economy</text>
  <text x="160" y="288" font-size="10.5" fill="#666">Eliminate waste, circulate materials, regenerate nature</text>

  <text x="126" y="328" text-anchor="end" font-size="12" font-weight="500" fill="#666">2011</text>
  <circle cx="140" cy="324" r="3.5" fill="#a09880"/>
  <text x="160" y="322" font-size="14" fill="#333">Shared Value</text>
  <text x="160" y="338" font-size="10.5" fill="#666">Create economic and social value simultaneously</text>

  <text x="126" y="378" text-anchor="end" font-size="12" font-weight="500" fill="#666">2012</text>
  <circle cx="140" cy="374" r="3.5" fill="#a09880"/>
  <text x="160" y="372" font-size="14" fill="#333">Doughnut Economics</text>
  <text x="160" y="388" font-size="10.5" fill="#666">Thrive between a social floor and an ecological ceiling</text>

  <text x="126" y="428" text-anchor="end" font-size="12" font-weight="500" fill="#666">2010s</text>
  <circle cx="140" cy="424" r="3.5" fill="#a09880"/>
  <text x="160" y="422" font-size="14" fill="#333">Restorative</text>
  <text x="160" y="438" font-size="10.5" fill="#666">Return damaged systems to a healthy state</text>

  <text x="126" y="478" text-anchor="end" font-size="12" font-weight="500" fill="#666">2020s</text>
  <circle cx="140" cy="474" r="3.5" fill="#a09880"/>
  <text x="160" y="472" font-size="14" fill="#333">Regenerative</text>
  <text x="160" y="488" font-size="10.5" fill="#666">Go beyond sustaining — enrich the living system</text>

  <text x="126" y="528" text-anchor="end" font-size="12" font-weight="500" fill="#666">2021</text>
  <circle cx="140" cy="524" r="3.5" fill="#a09880"/>
  <text x="160" y="522" font-size="14" fill="#333">Net Positive</text>
  <text x="160" y="538" font-size="10.5" fill="#666">Leave the world better than you found it</text>

  <path d="M640,64 C658,64 658,534 640,534" fill="none" stroke="#a09880" stroke-width="1"/>
  <line x1="640" y1="299" x2="658" y2="299" stroke="#a09880" stroke-width="1"/>
  <text x="633" y="275" text-anchor="end" font-size="10" fill="#666">each assumes</text>
  <text x="633" y="293" text-anchor="end" font-family="'Cormorant Garamond', serif" font-weight="400" font-size="14" fill="#555">self ≠ system</text>
  <text x="633" y="313" text-anchor="end" font-size="10" font-style="italic" fill="#777">balance · align · bridge</text>

  <line x1="140" y1="558" x2="140" y2="582" stroke="#a09880" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="50" y="590" width="580" height="44" rx="4" fill="none" stroke="#a09880" stroke-width="0.5" stroke-dasharray="6,3"/>
  <text x="340" y="609" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="13.5" font-style="italic" fill="#555">What if the gap is not in the world — but in the premise?</text>
  <text x="340" y="627" text-anchor="middle" font-size="10.5" fill="#666">Aristotle (εὐδαιμονία) · Nguni Bantu (ubuntu) · Japanese Buddhism (縁起 engi)</text>

  <line x1="140" y1="644" x2="140" y2="700" stroke="#4a7a4a" stroke-width="1.5"/>
  <circle cx="140" cy="674" r="4" fill="#4a7a4a"/>
  <text x="160" y="669" font-family="'Cormorant Garamond', serif" font-size="14" fill="#2a5a2a">Your fire and your mountain are one system</text>
  <text x="160" y="687" font-size="10.5" fill="#5a8a5a">Practices that enrich the system enrich you</text>

  <text x="340" y="740" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="300" font-size="12.5" font-style="italic" fill="#555">When the fire enriches the mountain,</text>
  <text x="340" y="758" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="300" font-size="12.5" font-style="italic" fill="#555">the clay for the next bowl is better than today's.</text>
</svg>
