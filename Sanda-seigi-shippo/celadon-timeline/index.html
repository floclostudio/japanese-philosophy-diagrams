            <line x1="385" y1="175" x2="378" y2="162" />
            
            {/* Kyushu: 31-34°N, 129-132°E → x:338-373, y:151-183 */}
            <line x1="340" y1="155" x2="370" y2="152" />
            <line x1="370" y1="152" x2="375" y2="175" />
            <line x1="375" y1="175" x2="360" y2="195" />
            <line x1="360" y1="195" x2="338" y2="190" />
            <line x1="338" y1="190" x2="335" y2="165" />
            <line x1="335" y1="165" x2="340" y2="155" />
          </g>
          
          {/* Taiwan: 22-25°N, 120-122°E → x:233-257, y:248-280 */}
          <g stroke="#888" strokeWidth="1.5" fill="none" opacity="0.15">
            <line x1="240" y1="248" x2="255" y2="252" />
            <line x1="255" y1="252" x2="252" y2="275" />
            <line x1="252" y1="275" x2="238" y2="270" />
            <line x1="238" y1="270" x2="240" y2="248" />
          </g>

          {/* Location markers - precise positions */}
          {/* Longquan: 28.1°N, 119.5°E */}
          <circle cx={geo.longquan.x} cy={geo.longquan.y} r="8" fill={colors.china} />
          <text x={geo.longquan.x} y={geo.longquan.y + 22} textAnchor="middle" fontSize="10" fill={colors.china} fontWeight="500">{t.map.longquan}</text>
          
          {/* Hizen/Arita: 33.2°N, 129.9°E */}
          <circle cx={geo.hizen.x} cy={geo.hizen.y} r="9" fill={colors.japanLight} stroke={colors.japan} strokeWidth="2" />
          <text x={geo.hizen.x - 25} y={geo.hizen.y + 22} textAnchor="middle" fontSize="10" fill={colors.japan} fontWeight="500">{t.map.hizen}</text>

          {/* Sanda: 34.9°N, 135.2°E */}
          <circle cx={geo.sanda.x} cy={geo.sanda.y} r="10" fill={colors.sanda} stroke={colors.sandaLight} strokeWidth="3" />
          <text x={geo.sanda.x + 20} y={geo.sanda.y + 5} textAnchor="start" fontSize="12" fill={colors.sanda} fontWeight="600">{t.map.sanda}</text>

          {/* Flow arrows */}
          <defs>
            <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M 0 0 L 6 3 L 0 6 Z" fill={colors.china} />
            </marker>
            <marker id="arrowS" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M 0 0 L 6 3 L 0 6 Z" fill={colors.sanda} />
            </marker>
          </defs>

          {/* China (Longquan) to Japan (Sanda) route */}
          <path d={`M ${geo.longquan.x + 10} ${geo.longquan.y - 8} Q 320 170, ${geo.sanda.x - 12} ${geo.sanda.y + 5}`}
                fill="none" stroke={colors.china} strokeWidth="2" strokeDasharray="6,4" markerEnd="url(#arrowC)" opacity="0.5" />
          <text x="310" y="175" textAnchor="middle" fontSize="9" fill={colors.china}>11th c.</text>

          {/* Hizen to Sanda */}
          <path d={`M ${geo.hizen.x + 8} ${geo.hizen.y - 8} Q 385 140, ${geo.sanda.x - 10} ${geo.sanda.y}`}
                fill="none" stroke={colors.sanda} strokeWidth="2" strokeDasharray="5,3" markerEnd="url(#arrowS)" opacity="0.6" />
          <text x="378" y="133" textAnchor="middle" fontSize="9" fill={colors.sanda}>1799</text>

          {/* Country labels */}
          <text x="140" y="145" textAnchor="middle" fontSize="14" fill={colors.china} fontWeight="400" opacity="0.4">{t.map.china}</text>
          <text x="325" y="115" textAnchor="middle" fontSize="8" fill="#777" opacity="0.4">{t.map.korea}</text>
          <text x="460" y="55" textAnchor="middle" fontSize="11" fill={colors.japan} fontWeight="400" opacity="0.4">{t.map.japan}</text>
        </svg>
      </div>

      {/* Timeline */}
      <div style={{ maxWidth: '850px', margin: '0 auto', position: 'relative' }}>
        
        {/* China section */}
        <div style={{ position: 'relative', paddingLeft: '30px' }}>
          <div style={{ position: 'absolute', left: '6px', top: '20px', bottom: '0', width: '2px', backgroundColor: colors.china, opacity: 0.3 }} />
          <div style={{ fontSize: '11px', fontWeight: '600', color: colors.china, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '15px' }}>CHINA 中国</div>
          {chinaItems.map((item) => {
            const isActive = activeNode === item.id;
            return (
              <div key={item.id} onClick={() => setActiveNode(isActive ? null : item.id)} style={{ display: 'flex', alignItems: 'flex-start', marginBottom: '20px', cursor: 'pointer', position: 'relative' }}>
                <div style={{ position: 'absolute', left: '-24px', top: '3px', width: item.highlight ? '14px' : '10px', height: item.highlight ? '14px' : '10px', borderRadius: '50%', backgroundColor: item.color, border: `2px solid ${colors.bg}`, boxShadow: isActive ? `0 0 0 3px ${colors.light}` : '0 1px 3px rgba(0,0,0,0.15)', zIndex: 2 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', marginBottom: '3px' }}>
                    <span style={{ fontSize: '12px', fontWeight: '600', color: item.color }}>{item.year}</span>
                    <span style={{ fontSize: '11px', color: '#9ca3af' }}>{item.era[language]} · {item.location[language]}</span>
                  </div>
                  <h3 style={{ fontSize: '16px', fontWeight: '500', color: '#1f2937', marginBottom: '4px' }}>{item.title[language]}</h3>
                  {isActive && <p style={{ fontSize: '14px', color: '#6b7280', lineHeight: '1.7', marginTop: '8px', animation: 'fadeIn 0.25s ease' }}>{item.description[language]}</p>}
                </div>
              </div>
            );
          })}
        </div>

        {/* Branch to Japan */}
        <div style={{ position: 'relative', height: '40px', marginLeft: '6px' }}>
          <svg width="80" height="40" style={{ position: 'absolute', left: '0', top: '-10px' }}>
            <path d="M 2 0 Q 2 30, 40 35" fill="none" stroke={colors.japan} strokeWidth="2" opacity="0.4" />
          </svg>
        </div>

        {/* Japan section */}
        <div style={{ position: 'relative', paddingLeft: '70px', marginTop: '-10px' }}>
          <div style={{ position: 'absolute', left: '46px', top: '20px', bottom: '0', width: '2px', backgroundColor: colors.japan, opacity: 0.3 }} />
          <div style={{ fontSize: '11px', fontWeight: '600', color: colors.japan, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '15px' }}>JAPAN 日本</div>
          {japanItems.map((item) => {
            const isActive = activeNode === item.id;
            return (
              <div key={item.id} onClick={() => setActiveNode(isActive ? null : item.id)} style={{ display: 'flex', alignItems: 'flex-start', marginBottom: '20px', cursor: 'pointer', position: 'relative' }}>
                <div style={{ position: 'absolute', left: '-24px', top: '3px', width: item.highlight ? '14px' : '10px', height: item.highlight ? '14px' : '10px', borderRadius: '50%', backgroundColor: item.color, border: `2px solid ${colors.bg}`, boxShadow: isActive ? `0 0 0 3px ${colors.light}` : '0 1px 3px rgba(0,0,0,0.15)', zIndex: 2 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', marginBottom: '3px' }}>
                    <span style={{ fontSize: '12px', fontWeight: '600', color: item.color }}>{item.year}</span>
                    <span style={{ fontSize: '11px', color: '#9ca3af' }}>{item.era[language]} · {item.location[language]}</span>
                  </div>
                  <h3 style={{ fontSize: '16px', fontWeight: '500', color: '#1f2937', marginBottom: '4px' }}>{item.title[language]}</h3>
                  {isActive && <p style={{ fontSize: '14px', color: '#6b7280', lineHeight: '1.7', marginTop: '8px', animation: 'fadeIn 0.25s ease' }}>{item.description[language]}</p>}
                </div>
              </div>
            );
          })}
        </div>

        {/* Branch to Sanda */}
        <div style={{ position: 'relative', height: '40px', marginLeft: '46px' }}>
          <svg width="80" height="40" style={{ position: 'absolute', left: '0', top: '-10px' }}>
            <path d="M 2 0 Q 2 30, 40 35" fill="none" stroke={colors.sanda} strokeWidth="2" opacity="0.4" />
          </svg>
        </div>

        {/* Sanda section */}
        <div style={{ position: 'relative', paddingLeft: '110px', marginTop: '-10px' }}>
          <div style={{ position: 'absolute', left: '86px', top: '20px', bottom: '20px', width: '2px', backgroundColor: colors.sanda, opacity: 0.3 }} />
          <div style={{ fontSize: '11px', fontWeight: '600', color: colors.sanda, letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '15px' }}>SANDA 三田</div>
          {sandaItems.map((item) => {
            const isActive = activeNode === item.id;
            return (
              <div key={item.id} onClick={() => setActiveNode(isActive ? null : item.id)} style={{ display: 'flex', alignItems: 'flex-start', marginBottom: '20px', cursor: 'pointer', position: 'relative' }}>
                <div style={{ position: 'absolute', left: '-24px', top: '3px', width: item.highlight ? '14px' : '10px', height: item.highlight ? '14px' : '10px', borderRadius: '50%', backgroundColor: item.color, border: `2px solid ${colors.bg}`, boxShadow: isActive ? `0 0 0 3px ${colors.light}` : '0 1px 3px rgba(0,0,0,0.15)', zIndex: 2 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', marginBottom: '3px' }}>
                    <span style={{ fontSize: '12px', fontWeight: '600', color: item.color }}>{item.year}</span>
                    <span style={{ fontSize: '11px', color: '#9ca3af' }}>{item.era[language]} · {item.location[language]}</span>
                  </div>
                  <h3 style={{ fontSize: '16px', fontWeight: '500', color: '#1f2937', marginBottom: '4px' }}>{item.title[language]}</h3>
                  {isActive && (
                    <div style={{ animation: 'fadeIn 0.25s ease' }}>
                      <p style={{ fontSize: '14px', color: '#6b7280', lineHeight: '1.7', marginTop: '8px' }}>{item.description[language]}</p>
                      {item.hasProfile && (
                        <button onClick={(e) => { e.stopPropagation(); setShowKamesukeProfile(true); }}
                          style={{ marginTop: '12px', background: 'none', border: `1px solid ${item.color}`, color: item.color, padding: '6px 14px', cursor: 'pointer', fontSize: '12px', borderRadius: '3px', fontFamily: 'inherit' }}
                        >{t.viewProfile}</button>
                      )}
                      {item.hasZuihoProfile && (
                        <button onClick={(e) => { e.stopPropagation(); setShowZuihoProfile(true); }}
                          style={{ marginTop: '12px', background: 'none', border: `1px solid ${item.color}`, color: item.color, padding: '6px 14px', cursor: 'pointer', fontSize: '12px', borderRadius: '3px', fontFamily: 'inherit' }}
                        >{t.viewProfile}</button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <p style={{ textAlign: 'center', fontSize: '12px', color: '#9ca3af', marginTop: '35px' }}>{t.clickHint}</p>

      <footer style={{ marginTop: '60px', padding: '20px', textAlign: 'center', borderTop: '1px solid #eee', color: '#666', fontSize: '14px' }}>
        <p><a href="https://medium.com/@floclostudio" target="_blank" rel="noopener noreferrer" style={{ color: '#666', margin: '0 10px', textDecoration: 'none' }}>Medium</a>·<a href="https://buymeacoffee.com/floclostudio" target="_blank" rel="noopener noreferrer" style={{ color: '#666', margin: '0 10px', textDecoration: 'none' }}>Buy me a coffee</a></p>
      </footer>

      <style>{`
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap');
      `}</style>
    </div>
  );
};



ReactDOM.createRoot(document.getElementById('root')).render(<CeladonTimeline />);
  </script>
</body>
